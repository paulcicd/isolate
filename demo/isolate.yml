schema_version: 2
data_root: /opt/auth

redis:
  host: redis
  port: 6379
  db: 0
  socket_timeout: 3

keycloak:
  issuer: http://localhost:18080/realms/isolate-demo
  client_id: isolate-demo
  client_secret: isolate-demo-secret
  scopes:
    - openid
    - profile
    - email
  verify_tokens: true
  expected_audience: isolate-demo
  jwks_cache_path: /opt/auth/cache/keycloak_jwks.json
  jwks_cache_ttl: 3600
  poll_timeout: 300
  tls_verify: true

dashboard:
  enabled: true
  listen_host: 0.0.0.0
  listen_port: 18081
  public_url: http://localhost:18081
  secret_key_file: /opt/auth/keys/dashboard_secret
  admin_groups:
    - Demo-DevOps
  refresh_seconds: 5
  require_mutation_confirmation: true
  default_locale: en

build:
  version: 2.1.0-demo
  revision: demo-source

access_packages:
  enabled: true
  max_rules: 50
  max_assignments_per_operation: 100

history:
  admin_groups:
    - Demo-DevOps
  default_limit: 10
  max_limit: 100

access:
  admin_groups:
    - Demo-DevOps
  default_ttl: 2h
  max_ttl: 24h
  ticket_required: false
  ticket_pattern: "^(INC|CHG)-[0-9]+$"
  request_templates:
    database-debug:
      remote_user: dba
      sudo_mode: none
      ttl: 2h

command_audit:
  enabled: true
  require_connection_id: true
  require_active_session: true
  completion_grace_seconds: 30
  max_command_length: 4096
  send_env: true
  ingest_user: auth

session_control:
  enabled: true
  terminate_enabled: true
  poll_interval: 1
  heartbeat_interval: 5
  active_ttl: 3600
  live_tail_bytes: 262144
  alerts:
    enabled: false

ssh:
  binary: /usr/bin/ssh
  config_path: /opt/auth/configs/demo-ssh.conf
  allow_unknown_args: false
  allowed_extra_args:
    - -4
    - -6
    - -v
    - -vv
    - -vvv
  default_remote_user: null
  default_sudo_mode: none
  require_known_hosts: true
  allocate_tty: true

logging:
  base_path: /opt/auth/logs
  jsonl_name: session.jsonl
  sink: local
  fail_closed: false
  retention_days: 7
  sinks: []
  integrity:
    enabled: false

policy:
  default_allowed_actions:
    - ssh
  fallback_remote_user: null

replay:
  max_bytes: 10485760
  default_speed: 1

notifications:
  enabled: false
  timeout_seconds: 3
  fail_closed: false
  sinks: []

backup:
  base_path: /opt/auth/backups/service
  retention_count: 3
  include_logs: true
