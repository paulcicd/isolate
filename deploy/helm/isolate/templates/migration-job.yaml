{{- if .Values.migration.enabled }}
{{- if ne .Values.migration.acknowledgement "I_HAVE_VERIFIED_BACKUP_AND_SCHEMA_PLAN" }}
{{- fail "migration requires a verified backup/schema plan acknowledgement; jobs never run by default" }}
{{- end }}
{{- if not .Values.migration.command }}
{{- fail "migration.command must explicitly name the reviewed state operation" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "isolate.fullname" . }}-manual-state-operation
  annotations:
    isolate.dev/manual-state-operation: "true"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "isolate.account" . }}
      automountServiceAccountToken: false
      {{- include "isolate.init" . | nindent 6 }}
      containers:
        - name: state-operation
          image: {{ include "isolate.image" . | quote }}
          command: {{ toJson .Values.migration.command }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          volumeMounts: {{ include "isolate.mounts" . | nindent 12 }}
      volumes: {{ include "isolate.volumes" . | nindent 8 }}
{{- end }}
